<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coop Sociétaires</title>
  <meta name="theme-color" content="#1f6f4a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coop Scan">
  <script>
    // Ouverte depuis une icône d'écran d'accueil : l'app doit démarrer sur le scanner.
    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
      location.replace('./');
    }
  </script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="brand">
    <img class="logo" src="./icons/logo.jpg" alt="Coopérative de Ménilmontant" width="96" height="96">
    <div>
    <h1>Coop Sociétaires</h1>
    <p id="source" class="source">Chargement…</p>
    </div>
  </header>
  <main>
    <p class="muted">Scannez le QR de la carte de membre du sociétaire avec l'app pour accéder à ses contributions.</p>
    <div id="login"></div>
    <div id="cards" class="cards"></div>
  </main>
  <footer><a href="./">Retour au scanner</a></footer>

  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./data.js"></script>
  <script>
    (async () => {
      const { configure, loadTransactions, membersFrom } = window.CoopData;
      const src = document.getElementById('source');
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      async function render(config) {
        configure(config);
        src.textContent = 'Chargement…';
        const tx = await loadTransactions();
        const members = membersFrom(tx.transactions);
        src.textContent = tx.ok ? `${members.length} contributeurs depuis l'onglet Transactions` : 'Onglet Transactions injoignable : ' + tx.error;
        src.className = 'source ' + (tx.ok ? 'sheet' : 'demo');
        const base = location.origin + location.pathname.replace(/cartes\.html$/, '');
        document.getElementById('cards').innerHTML = members.map(m => {
          const url = `${base}?id=${encodeURIComponent(m.id)}`;
          const qr = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=${encodeURIComponent(url)}`;
          return `<div class="card adherent">
            <img src="${qr}" alt="QR ${esc(m.name)}" loading="lazy">
            <h3>${esc(m.name)}</h3>
            <div>${esc(m.tier)}</div>
            <small>${esc(m.id)}</small>
          </div>`;
        }).join('');
      }
      const config = await window.CoopAuth.unlockStored();
      if (config) render(config);
      else { src.textContent = 'Connexion requise'; window.CoopAuth.requireLogin(document.getElementById('login'), render); }
    })();
  </script>
</body>
</html>
